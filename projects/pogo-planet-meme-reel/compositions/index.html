<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="gsap.min.js"></script>
    <style>
      @font-face { font-family: "Exo2"; src: url("fonts/exo-2-latin-900-italic.woff2") format("woff2"); font-weight: 900; font-style: italic; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #000; font-family: "Exo2", sans-serif; font-weight: 900; font-style: italic; text-transform: uppercase; }
      #shk { position: absolute; inset: 0; }
      .scene { position: absolute; inset: 0; overflow: hidden; opacity: 0; }
      .cam { position: absolute; inset: 0; transform-origin: 540px 1000px; }
      .sky { position: absolute; inset: 0; background: linear-gradient(180deg, #66806a 0%, #9aa766 55%, #c9b84a 100%); }
      .sun { position: absolute; left: 700px; top: 700px; width: 240px; height: 240px; border-radius: 50%; background: #f4c63d; box-shadow: 0 0 120px 40px rgba(244,198,61,.35); }
      .hills { position: absolute; left: 0; bottom: 0; width: 1080px; height: 900px; }
      .ground { position: absolute; left: 0; top: 1500px; width: 1080px; height: 420px; background: #17191a; }
      .ground::before { content: ""; position: absolute; left: 0; top: -16px; width: 100%; height: 26px; background: #2f8a55; border-radius: 0 0 8px 8px; }
      .char { position: absolute; }
      .bob { position: absolute; left: 0; top: 0; }
      .hat { position: absolute; }
      .ring { position: absolute; left: 690px; top: 1250px; width: 260px; height: 260px; border-radius: 50%; border: 16px solid #fff; opacity: 0; }
      .gold { position: absolute; inset: 0; background: radial-gradient(circle at 50% 45%, #ffd75e, #c98a12 55%, #4a2f06 100%); }
      .rays { position: absolute; left: -460px; top: -100px; width: 2000px; height: 2000px; fill: #fff6c8; opacity: 0; }
      #boss { position: absolute; left: -796px; top: 260px; width: 1960px; height: 1470px; }
      #dark5 { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 70%, rgba(40,4,8,.3), rgba(10,2,4,.95) 80%); opacity: 0; }
      .wped { position: absolute; top: 1080px; width: 240px; height: 337px; }
      .cap { position: absolute; left: 0; width: 1080px; top: 330px; text-align: center; font-size: 150px; line-height: 1; }
      .cap .w, #a1 .w { text-shadow: 0 10px 0 rgba(0,0,0,.45); }
      .w { color: #fbfbf7; }
      .y { background: linear-gradient(180deg, #ffe14d, #ffa600); -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; filter: drop-shadow(0 10px 0 rgba(0,0,0,.45)); }
      #intro { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; transform-origin: 540px 960px; }
      #intro div { font-size: 110px; color: #fbfbf7; letter-spacing: 4px; font-style: normal; }
      #t3 { font-size: 150px !important; color: #ffc400 !important; }
      #bars { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
      #bars::before, #bars::after { content: ""; position: absolute; left: 0; width: 1080px; height: 200px; background: #000; }
      #bars::before { top: 0; } #bars::after { bottom: 0; }
      #punch { position: absolute; inset: 0; background: #f4f2ec; opacity: 0; z-index: 45; display: flex; align-items: center; justify-content: center; }
      #pt { font-size: 58px; color: #222; text-transform: lowercase; font-style: normal; letter-spacing: 1px; }
      #again { position: absolute; inset: 0; opacity: 0; z-index: 26; overflow: hidden; }
      #a1 { position: absolute; left: 0; width: 1080px; top: 300px; text-align: center; font-size: 120px; line-height: 1; }
      #logo { position: absolute; left: 300px; top: 620px; width: 480px; }
      #cta { position: absolute; left: 0; width: 1080px; top: 860px; text-align: center; }
      .bar { display: inline-block; padding: 10px 36px 6px; font-size: 76px; transform: rotate(-4deg) skewX(-6deg); background: #c3202f; color: #fff; }
      #loopfade { position: absolute; inset: 0; background: #000; opacity: 0; z-index: 70; }
      #flash { position: absolute; inset: 0; background: #fff; opacity: 0; z-index: 60; }
      #vig { position: absolute; inset: 0; background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(0,0,0,.45) 100%); z-index: 40; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="11.0" data-width="1080" data-height="1920">
      <div id="shk" class="clip" data-start="0" data-duration="11.0" data-track-index="0">
        <div id="intro"><div id="t1">THIS GAME</div><div id="t2">WILL CHANGE</div><div id="t3">YOUR LIFE.</div></div>
        
      <div class="scene" id="m1"><div class="cam" id="cam1"><div class="sky"></div><div class="sun"></div>
        <svg class="hills" viewBox="0 0 1080 900" preserveAspectRatio="none"><polygon fill="#58735e" points="0,900 0,560 140,380 260,560 400,300 560,560 700,420 860,560 980,340 1080,480 1080,900" /><polygon fill="#2f6b4a" points="0,900 0,700 90,560 180,700 330,520 470,720 640,600 780,720 900,560 1080,740 1080,900" /></svg>
        <div class="ground"></div><div class="ring" id="ring1"></div><div class="char" id="r1" style="left:520px;top:1500px"><div class="bob" id="r1b"><div style="position:absolute;transform:scale(1.5);transform-origin:0 0"><div style="position:absolute;left:-95px;top:-300px;width:330px;height:380px"><img src="img/stick.png" style="position:absolute;left:10px;top:49px" /><img src="img/body.png" style="position:absolute;left:0;top:0" /><img class="hat" id="r1h0" src="img/hatfit/h29.png" style="left:165.2px;top:-12.2px;width:108.7px;height:110.7px;opacity:1" /></div></div></div></div></div><div class="cap" id="cap1"><span class="w">ONE</span> <span class="y">TAP.</span></div></div>
      <div class="scene" id="m2"><div class="cam" id="cam2"><div class="sky"></div><div class="sun"></div>
        <svg class="hills" viewBox="0 0 1080 900" preserveAspectRatio="none"><polygon fill="#58735e" points="0,900 0,560 140,380 260,560 400,300 560,560 700,420 860,560 980,340 1080,480 1080,900" /><polygon fill="#2f6b4a" points="0,900 0,700 90,560 180,700 330,520 470,720 640,600 780,720 900,560 1080,740 1080,900" /></svg>
        <div class="ground"></div><div class="char" id="r2" style="left:330px;top:1700px"><div class="bob" id="r2b"><div style="position:absolute;transform:scale(2.6);transform-origin:0 0"><div style="position:absolute;left:-95px;top:-300px;width:330px;height:380px"><img src="img/stick.png" style="position:absolute;left:10px;top:49px" /><img src="img/body.png" style="position:absolute;left:0;top:0" /><img class="hat" id="r2h0" src="img/hatfit/h00.png" style="left:171.7px;top:6.9px;width:95.3px;height:98.3px;opacity:0" /><img class="hat" id="r2h1" src="img/hatfit/h08.png" style="left:158.0px;top:21.1px;width:106.0px;height:81.3px;opacity:0" /><img class="hat" id="r2h2" src="img/hatfit/h15.png" style="left:153.7px;top:22.7px;width:106.7px;height:82.3px;opacity:0" /><img class="hat" id="r2h3" src="img/hatfit/h22.png" style="left:163.9px;top:11.8px;width:109.3px;height:110.7px;opacity:0" /><img class="hat" id="r2h4" src="img/hatfit/h29.png" style="left:165.2px;top:-12.2px;width:108.7px;height:110.7px;opacity:0" /><img class="hat" id="r2h5" src="img/hatfit/h06.png" style="left:180.7px;top:6.9px;width:83.0px;height:97.7px;opacity:0" /><img class="hat" id="r2h6" src="img/hatfit/h14.png" style="left:160.9px;top:17.6px;width:92.7px;height:84.0px;opacity:0" /><img class="hat" id="r2h7" src="img/hatfit/h21.png" style="left:164.1px;top:17.2px;width:108.0px;height:104.3px;opacity:0" /><img class="hat" id="r2h8" src="img/hatfit/h28.png" style="left:170.3px;top:12.0px;width:109.3px;height:113.0px;opacity:0" /><img class="hat" id="r2h9" src="img/hatfit/h05.png" style="left:156.8px;top:5.5px;width:109.3px;height:100.3px;opacity:0" /><img class="hat" id="r2h10" src="img/hatfit/h13.png" style="left:175.3px;top:12.6px;width:94.0px;height:91.3px;opacity:0" /><img class="hat" id="r2h11" src="img/hatfit/h20.png" style="left:165.6px;top:10.3px;width:109.3px;height:113.3px;opacity:0" /></div></div></div></div></div><div class="cap" id="cap2"><span class="w">190+</span> <span class="y">HATS.</span></div></div>
      <div class="scene" id="m3"><div class="cam" id="cam3"><div class="gold"></div><svg class="rays" id="ray3" viewBox="-1000 -1000 2000 2000"><polygon points="0,0 1398,-73 1398,73" /><polygon points="0,0 1339,409 1289,547" /><polygon points="0,0 1118,843 1024,955" /><polygon points="0,0 762,1174 636,1247" /><polygon points="0,0 315,1364 171,1390" /><polygon points="0,0 -171,1390 -315,1364" /><polygon points="0,0 -636,1247 -762,1174" /><polygon points="0,0 -1024,955 -1118,843" /><polygon points="0,0 -1289,547 -1339,409" /><polygon points="0,0 -1398,73 -1398,-73" /><polygon points="0,0 -1339,-409 -1289,-547" /><polygon points="0,0 -1118,-843 -1024,-955" /><polygon points="0,0 -762,-1174 -636,-1247" /><polygon points="0,0 -315,-1364 -171,-1390" /><polygon points="0,0 171,-1390 315,-1364" /><polygon points="0,0 636,-1247 762,-1174" /><polygon points="0,0 1024,-955 1118,-843" /><polygon points="0,0 1289,-547 1339,-409" /></svg><div class="char" id="r3" style="left:330px;top:1700px"><div class="bob" id="r3b"><div style="position:absolute;transform:scale(2.6);transform-origin:0 0"><div style="position:absolute;left:-95px;top:-300px;width:330px;height:380px"><img src="img/stick.png" style="position:absolute;left:10px;top:49px" /><img src="img/body.png" style="position:absolute;left:0;top:0" /><img class="hat" id="r3h0" src="img/hatfit/h03.png" style="left:162.8px;top:-0.8px;width:109.7px;height:103.0px;opacity:1" /></div></div></div></div></div><div class="cap" id="cap3"><span class="w"></span> <span class="y">LEGENDARY!</span></div></div>
      <div class="scene" id="m4"><div class="cam" id="cam4"><img id="boss" src="img/bosses.png" /></div><div class="cap" id="cap4"><span class="w">EPIC</span> <span class="y">BOSSES.</span></div></div>
      <div class="scene" id="m5"><div class="cam" id="cam5"><div class="sky"></div><div class="sun"></div>
        <svg class="hills" viewBox="0 0 1080 900" preserveAspectRatio="none"><polygon fill="#58735e" points="0,900 0,560 140,380 260,560 400,300 560,560 700,420 860,560 980,340 1080,480 1080,900" /><polygon fill="#2f6b4a" points="0,900 0,700 90,560 180,700 330,520 470,720 640,600 780,720 900,560 1080,740 1080,900" /></svg>
        <div class="ground"></div><div id="dark5"></div>
        <img class="wped" id="wp0" src="img/ped_easy.png" style="left:40px" /><img class="wped" id="wp1" src="img/ped_normal.png" style="left:295px" /><img class="wped" id="wp2" src="img/ped_hard.png" style="left:550px" /><img class="wped" id="wp3" src="img/ped_insane.png" style="left:805px" />
        <div class="char" id="r5" style="left:560px;top:1050px"><div class="bob" id="r5b"><div style="position:absolute;transform:scale(1.1);transform-origin:0 0"><div style="position:absolute;left:-95px;top:-300px;width:330px;height:380px"><img src="img/stick.png" style="position:absolute;left:10px;top:49px" /><img src="img/body.png" style="position:absolute;left:0;top:0" /><img class="hat" id="r5h0" src="img/hatfit/h29.png" style="left:165.2px;top:-12.2px;width:108.7px;height:110.7px;opacity:1" /></div></div></div></div></div><div class="cap" id="cap5"><span class="w">4</span> <span class="y">WORLDS.</span></div></div>
        <div id="bars"></div>
      </div>
      <div id="punch" class="clip" data-start="0" data-duration="11.0" data-track-index="1"><div id="pt">for like 10 minutes.</div></div>
      <div id="again" class="clip" data-start="0" data-duration="11.0" data-track-index="2">
        <div class="sky"></div><div class="sun"></div>
        <svg class="hills" viewBox="0 0 1080 900" preserveAspectRatio="none"><polygon fill="#58735e" points="0,900 0,560 140,380 260,560 400,300 560,560 700,420 860,560 980,340 1080,480 1080,900" /><polygon fill="#2f6b4a" points="0,900 0,700 90,560 180,700 330,520 470,720 640,600 780,720 900,560 1080,740 1080,900" /></svg>
        <div class="ground"></div>
        <div class="char" id="r6" style="left:560px;top:1500px"><div class="bob" id="r6b"><div style="position:absolute;transform:scale(1.3);transform-origin:0 0"><div style="position:absolute;left:-95px;top:-300px;width:330px;height:380px"><img src="img/stick.png" style="position:absolute;left:10px;top:49px" /><img src="img/body.png" style="position:absolute;left:0;top:0" /><img class="hat" id="r6h0" src="img/hatfit/h03.png" style="left:162.8px;top:-0.8px;width:109.7px;height:103.0px;opacity:1" /></div></div></div></div>
        <div id="a1"><span class="w">...THEN YOU</span><br><span class="y">PLAY AGAIN.</span></div>
        <img id="logo" src="img/logo.png" />
        <div id="cta"><span class="bar">PLAY NOW.</span></div>
      </div>
      <div id="vig" class="clip" data-start="0" data-duration="11.0" data-track-index="3"></div>
      <div id="flash" class="clip" data-start="0" data-duration="11.0" data-track-index="4"></div>
      <div id="loopfade" class="clip" data-start="0" data-duration="11.0" data-track-index="5"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });
      const seen = {};
      const ft = (sel, from, to, t) => { to.immediateRender = !seen[sel]; seen[sel] = true; tl.fromTo(sel, from, to, t); };
      const shake = (t, a, n) => tl.to("#shk", { x: a, y: -a * 0.6, duration: 0.035, ease: "sine.inOut", yoyo: true, repeat: n || 5 }, t);
      const flash = (t, p) => tl.fromTo("#flash", { opacity: p }, { opacity: 0, duration: 0.3, ease: "expo.out", immediateRender: false }, t);
      const show = (id, a, b) => { tl.set(id, { opacity: 1 }, a); tl.set(id, { opacity: 0 }, b); };
      // 1 Trailer intro: word by word
      [["#t1", 0.15], ["#t2", 0.65], ["#t3", 1.05]].forEach(([id, t]) => ft(id, { opacity: 0, scale: 1.25, filter: "blur(10px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: 0.35, ease: "power3.out" }, t));
      ft("#intro", { scale: 1 }, { scale: 1.08, duration: 1.5, ease: "sine.inOut" }, 0);
      tl.set("#intro", { opacity: 0 }, 1.5);
      // 2 Epic montage, one cut per second
      const C = [1.5, 2.5, 3.5, 4.5, 5.5];
      ["#m1", "#m2", "#m3", "#m4", "#m5"].forEach((id, i) => {
        show(id, C[i], i < 4 ? C[i + 1] : 7.3);
        ft("#cam" + (i + 1), { scale: 1.22 }, { scale: 1.0, duration: 0.95, ease: "power2.out" }, C[i]);
        ft("#cap" + (i + 1), { scale: 2.2, opacity: 0, rotation: -6 }, { scale: 1, opacity: 1, rotation: -3, duration: 0.22, ease: "power4.in" }, C[i] + 0.05);
        flash(C[i], 0.55); shake(C[i] + 0.27, 14);
      });
      // cut 1: slow-motion tap + jump
      ft("#ring1", { scale: 0.3, opacity: 1 }, { scale: 1.6, opacity: 0, duration: 0.6, ease: "expo.out" }, C[0] + 0.05);
      ft("#r1", { x: -200, y: 0, rotation: -10 }, { x: 80, y: -520, rotation: 8, duration: 1.0, ease: "power2.out" }, C[0]);
      // cut 2: hats flash on the head
      [0, 8, 15, 22, 29, 6, 14, 21, 28, 5, 13, 20].forEach((_, k) => { const t = C[1] + 0.04 + k * 0.075; if (k) tl.set("#r2h" + (k - 1), { opacity: 0 }, t); tl.set("#r2h" + k, { opacity: 1 }, t); });
      // cut 3: crown, golden rays
      ft("#ray3", { opacity: 0, rotation: 0 }, { opacity: 0.35, rotation: 25, duration: 1.0, ease: "sine.inOut" }, C[2]);
      ft("#r3h0", { y: -260, scale: 1.4 }, { y: 0, scale: 1, duration: 0.3, ease: "back.out(2)" }, C[2]);
      // cut 4: bosses slam
      ft("#boss", { y: -900 }, { y: 0, duration: 0.25, ease: "expo.in" }, C[3]);
      shake(C[3] + 0.25, 24, 7);
      // cut 5: four worlds slam in, darker each
      [0, 1, 2, 3].forEach(k => ft("#wp" + k, { y: 900 }, { y: 0, duration: 0.22, ease: "power4.out" }, C[4] + 0.08 + k * 0.16));
      ft("#dark5", { opacity: 0 }, { opacity: 0.6, duration: 0.7, ease: "power2.in" }, C[4] + 0.1);
      ft("#r5", { y: 0 }, { y: -420, duration: 0.5, ease: "power2.out" }, C[4] + 0.45);
      // 3 Freeze: colour drains, record scratch
      ft("#shk", { filter: "grayscale(0) brightness(1)" }, { filter: "grayscale(1) brightness(0.8)", duration: 0.35, ease: "power2.out" }, 6.5);
      tl.set("#shk", { filter: "grayscale(0) brightness(1)" }, 7.3);
      ft("#bars", { opacity: 1 }, { opacity: 0, duration: 0.01, ease: "power1.out" }, 7.3);
      // 4 Punchline on white
      show("#punch", 7.3, 9.0);
      ft("#pt", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.18, ease: "power2.out" }, 7.6499999999999995);
      // 5 ...then you play again
      show("#again", 9.0, 11.0);
      ft("#r6", { y: 900 }, { y: 0, duration: 0.4, ease: "back.out(1.6)" }, 9.0);
      tl.to("#r6b", { y: -70, duration: 0.25, ease: "sine.inOut", yoyo: true, repeat: 7 }, 9.4);
      ft("#a1", { scale: 2.2, opacity: 0, rotation: -6 }, { scale: 1, opacity: 1, rotation: -3, duration: 0.25, ease: "power4.in" }, 9.1);
      shake(9.35, 10); flash(9.35, 0.4);
      ft("#logo", { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 9.8);
      ft("#cta", { x: -1100 }, { x: 0, duration: 0.35, ease: "power3.out" }, 10.1);
      // loop seam into the black opening
      ft("#loopfade", { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.in" }, 10.75);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
